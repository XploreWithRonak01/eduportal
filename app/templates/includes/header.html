<header class="glass-nav sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <a href="{% url 'home' %}" class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 rounded-xl flex items-center justify-center bg-gradient-to-br from-[#168e6a] to-[#0f6b4f]">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
                <div>
                    <span class="font-bold text-2xl text-[#292d32]">Edu</span>
                    <span class="font-bold text-2xl text-[#168e6a]">Portal</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-2">
                <a href="{% url 'home' %}" class="px-5 py-2.5 rounded-full font-medium 
                    {% if request.resolver_match.url_name == 'home' %}
                        text-white bg-gradient-to-br from-[#168e6a] to-[#0f6b4f] shadow-lg
                    {% else %}
                        text-[#292d32] hover:bg-[#168e6a]/10 transition
                    {% endif %}">
                    Home
                </a>
                <a href="{% url 'school_list' %}" class="px-5 py-2.5 rounded-full font-medium
                    {% if request.resolver_match.url_name == 'school_list' %}
                        text-white bg-gradient-to-br from-[#168e6a] to-[#0f6b4f] shadow-lg
                    {% else %}
                        text-[#292d32] hover:bg-[#168e6a]/10 transition
                    {% endif %}">
                    Schools
                </a>
                <a href="{% url 'track_status' %}" class="px-5 py-2.5 rounded-full font-medium
                    {% if request.resolver_match.url_name == 'track_status' %}
                        text-white bg-gradient-to-br from-[#168e6a] to-[#0f6b4f] shadow-lg
                    {% else %}
                        text-[#292d32] hover:bg-[#168e6a]/10 transition
                    {% endif %}">
                    Track Status
                </a>
                <a href="{% url 'about_us' %}" class="px-5 py-2.5 rounded-full font-medium
                    {% if request.resolver_match.url_name == 'about_us' %}
                        text-white bg-gradient-to-br from-[#168e6a] to-[#0f6b4f] shadow-lg
                    {% else %}
                        text-[#292d32] hover:bg-[#168e6a]/10 transition
                    {% endif %}">
                    About
                </a>
                <a href="{% url 'contact' %}" class="px-5 py-2.5 rounded-full font-medium
                    {% if request.resolver_match.url_name == 'contact' %}
                        text-white bg-gradient-to-br from-[#168e6a] to-[#0f6b4f] shadow-lg
                    {% else %}
                        text-[#292d32] hover:bg-[#168e6a]/10 transition
                    {% endif %}">
                    Contact
                </a>
            </nav>
            <div class="md:hidden">
                <button class="p-2 rounded-lg hover:bg-gray-100 transition text-[#292d32]">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </div>
</header>
